[package]
name = "cjson-rs"
version = "0.1.0"
edition = "2024"
description = "A safe Rust port of cJSON's JSON parser and utility layer"
license = "MIT"

[lib]
name = "cjson_rs"
path = "src/lib.rs"
# rlib for the Rust bin/lib; staticlib so the original C test suite (and the
# differential fuzz driver) can link the FFI layer directly.
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "cjson-rs"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "bench/bench.rs"

# Rust-native integration tests under tests/port/ mirroring the original C suite.
# (Explicit [[test]] targets because Cargo only auto-discovers tests directly
# under tests/, and tests/original/ is C, kept untouched for the kickoff hash.)
[[test]]
name = "port_parse_examples"
path = "tests/port/parse_examples.rs"

[[test]]
name = "port_parse_errors"
path = "tests/port/parse_errors.rs"

[[test]]
name = "port_print"
path = "tests/port/print.rs"

[[test]]
name = "port_minify"
path = "tests/port/minify.rs"

[[test]]
name = "port_compare"
path = "tests/port/compare.rs"

[[test]]
name = "port_utils"
path = "tests/port/utils.rs"

[profile.release]
codegen-units = 1
lto = true
strip = true
